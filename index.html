async function callScript(cfg,payload){const r=await fetch(cfg.url,{method:"POST",body:JSON.stringify({...payload,key:cfg.key})});const j=await r.json();if(!j.ok)throw new Error(j.error||"Error del script");return j}
async function sendMails(btn,key){const list=result.people.filter(p=>p.e&&!p.sent);if(!list.length)return;const cfg={url:mailUrl(),key};
  btn.disabled=true;btn.textContent="Enviando…";const M=$("#mm");M.textContent="";
  try{const j=await callScript(cfg,{mails:list.map(p=>({to:p.e,subject:SUBJ(),body:msgFor(p),html:htmlFor(p)}))});
    store.set("ai-mail",{...(store.get("ai-mail")||{}),key});
    const ok=[],bad=[];(j.res||[]).forEach(x=>{const p=list.find(q=>q.e===x.to);if(!p)return;if(x.ok){p.sent=true;p.via="mail";ok.push(p.n)}else bad.push(p.n)});
    const rest=result.people.filter(p=>!p.sent).length;
    closeModal();result.flash=(ok.length?`${ok.length===1?"Enviado 1 email":`Enviados ${ok.length} emails`}.`:"")+(bad.length?` No se pudo enviar a ${bad.join(", ")}.`:"")+(rest?` Envía ${rest===1?"el que falta":`los ${rest} que faltan`} por WhatsApp.`:" ¡Ya está todo!");
    store.set("ai-result",result);show("send");result.flash="";store.set("ai-result",result)}
  catch(err){btn.disabled=false;btn.textContent="Reintentar";
    if(/clave/i.test(err.message)){const c=store.get("ai-mail")||{};if(c.key){delete c.key;store.set("ai-mail",c);mailModal();$("#mm").textContent="La clave guardada ya no es la del script. Escribe la nueva."}else{M.textContent="Esa clave no es la del script.";$("#keyIn").select()}return}
    M.textContent="No se pudo confirmar el envío. Antes de reintentar, mira en Enviados de tu Gmail si los correos salieron."}}

  if(ovT){ovT.kill();ovT=null}ov.hidden=false;if(G){G.fromTo(ov,{opacity:0},{opacity:1,duration:.35,ease:"power2.out"});G.fromTo(ov.querySelectorAll(".ov-b>*:not(.msg),.ov-a>*"),{y:26,opacity:0},{y:0,opacity:1,duration:.8,stagger:.06,ease:EO,delay:.05})}document.body.classList.add("ov-on");document.documentElement.classList.add("ov-lock");const k=$("#keyIn");if(k){k.focus();k.onkeydown=e=>{if(e.key==="Enter")$("#mailGo").click()}}}

ov.addEventListener("click",e=>{const t=e.target.closest("#mailGo,#manual");if(e.target===ov){closeModal();return}if(!t)return;

/* ---------- mensaje ---------- */
const baseUrl=()=>PAGE_URL.split("#")[0];

const fdate=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||""))return d||"";const t=new Date(d+"T12:00:00");return t.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})};
function msgFor(p){const L=[["Presupuesto",eur(st.price)],["Cuándo",fdate(st.date)+(st.time?`, a las ${st.time}`:"")],["Dónde",st.place]].filter(x=>(x[1]||"").trim()).map(x=>`${x[0]}: ${x[1].trim()}`);
  return [`Hola ${p.n},`,`ya tienes tu amigo invisible.`,``,`Descúbrelo aquí (solo lo verás tú):`,baseUrl()+"#"+p.code,``,`Sorteo nº ${result.id}${(st.org||"").trim()?` · organiza ${st.org.trim()}`:""}. Tiene que ser el mismo número para todos.`].join("\n")}

    result={v:2,id,url:PAGE_URL,people:ps.map((a,i)=>{const b=ps[p[i]];return{n:a.n.trim(),e:a.e.trim(),code:shortSeal(id,[b.n.trim(),"",st.price,st.date,st.time,st.place,st.org,st.note]),sent:false}}),hist:seal("H1-",{id,p:ps.map((a,i)=>[norm(a.n),norm(ps[p[i]].n)])})};
    const H=(store.get("ai-hist")||[]).filter(x=>x.id!==id).slice(-4);H.push({id,t:Date.now(),h:result.hist});store.set("ai-hist",H);store.set("ai-result",result);wipeTo(id,()=>{render("send");curKey="send"},()=>mailModal())};

$("#app").addEventListener("click",async e=>{if(cur!=="send")return;const t=e.target.closest("#toMail,#cfgOpen,#cfgCancel,#cfgSave");if(!t)return;

  if(t.id==="cfgCancel"){show("send");return}
  if(t.id==="cfgSave"){const c={url:$("#cfgUrl").value.trim(),key:$("#cfgKey").value.trim()};if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(c.url)){$("#ms").textContent="La dirección tiene que ser la del script publicado: empieza por https://script.google.com y acaba en /exec.";return}
    if(!c.key){$("#ms").textContent="Falta la clave.";return}t.textContent="Probando…";

{const tb=$("#theme");const isDark=()=>(document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";
