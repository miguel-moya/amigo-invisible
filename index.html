<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Amigo invisible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{const t=localStorage.getItem("ai-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* VOICE: fino, silencioso, editorial; un formulario de estudio de diseño, no una web de sorteos.
   IDEA: una ficha impresa en papel gris con retícula de puntos; una pregunta por hoja.
   PICTURE: la propia pregunta: campos de texto gigantes, filas con círculo, y el contador 1/5 enorme abajo a la izquierda.
   COLOUR and TYPE: gris cálido, tinta casi negra, un solo acento rojo para etiquetas; Inter Tight en cuatro tamaños.
   LAYOUT: pantalla completa sin scroll, dos columnas (pregunta | respuestas); en móvil una columna. */
:root{color-scheme:light dark;--dot:16px;--g:32px;--t0:13px;--t1:17px;--t2:27.5px;--t3:44.5px;--t4:72px;--t5:116.5px;--t6:188.5px;
--bg:light-dark(#dedbd6,#151514);--ink:light-dark(#141413,#ecebe7);--mute:light-dark(#7a766f,#8d8a84);
--line:light-dark(#b9b5ae,#3a3936);--dotc:light-dark(rgba(20,20,19,.13),rgba(236,235,231,.09));--acc:light-dark(#c4391f,#ff6a4a);--field:light-dark(rgba(255,255,255,.35),rgba(255,255,255,.04))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 "Inter Tight",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
.paper{position:fixed;inset:72px var(--g) var(--g);border-radius:6px;background-image:radial-gradient(var(--dotc) 1px,transparent 1.2px);background-size:var(--dot) var(--dot);background-position:0 0;pointer-events:none}
header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 calc(var(--g) + 3*var(--dot));position:relative;z-index:2}
.brand{font-weight:600;font-size:22px;letter-spacing:-.03em}
.brand i{font-style:normal;color:var(--acc)}
.top a,.top button{font:500 var(--t0) "Inter Tight",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:none;border:0;padding:10px 0;margin-left:55px;cursor:pointer;min-height:44px;opacity:.38;transition:opacity .2s}
.top button:hover{opacity:.7}.top button[aria-pressed=true]{opacity:1}
.top .theme{width:44px;height:44px;padding:0;margin-left:34px;opacity:1;display:inline-grid;place-items:center;vertical-align:middle}.theme svg{width:21px;height:21px;transition:transform .4s}:root[data-theme=dark] .theme svg{transform:rotate(180deg)}
main{position:relative;z-index:1}
.screen{display:grid;grid-template-columns:minmax(0,.236fr) minmax(0,.146fr) minmax(0,.618fr);height:calc(100dvh - 72px);overflow:clip;padding:calc(5*var(--dot)) calc(var(--g) + 3*var(--dot)) calc(var(--g) + 5*var(--dot));animation:in .5s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.q{display:flex;flex-direction:column;min-height:0;grid-column:1}
.label{font-weight:500;font-size:var(--t0);letter-spacing:.1em;text-transform:uppercase;color:var(--acc);margin-bottom:21px;line-height:1}
h1{font-weight:400;font-size:clamp(var(--t3),4.5vw,var(--t4));line-height:1.02;letter-spacing:-.03em;margin:0;text-wrap:balance}
.q p{color:var(--mute);margin:21px 0 0;font-size:var(--t1);line-height:1.618}
.count{margin-top:auto;font-weight:400;font-size:clamp(var(--t4),min(13vw,24vh),var(--t6));line-height:.76;letter-spacing:-.06em;white-space:nowrap}
.count.sm{font-size:clamp(var(--t3),5.6vw,var(--t4));line-height:.9;letter-spacing:-.04em}
.a{display:flex;flex-direction:column;min-height:0;grid-column:3}
.body{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
.list{flex:0 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;overscroll-behavior:contain}
.list.more{-webkit-mask-image:linear-gradient(#000 calc(100% - 55px),transparent);mask-image:linear-gradient(#000 calc(100% - 55px),transparent)}
.opt-tag{font:inherit;letter-spacing:inherit;color:var(--mute);margin-left:.6em}
.cur{font-size:clamp(var(--t2),2.6vw,var(--t3));color:var(--mute)}
.areabox{display:flex;align-items:flex-end;min-height:calc(2*1.2*clamp(var(--t2),2.6vw,var(--t3)) + 12px)}
.area{resize:none;line-height:1.2;display:block;overflow:hidden;min-height:0!important;height:calc(1.2em + 12px);padding:4px 0 8px!important}
.when{display:grid;grid-template-columns:minmax(0,.618fr) minmax(0,.382fr);gap:34px}
.pick{font:400 clamp(var(--t2),3.1vw,var(--t3)) "Inter Tight",sans-serif;letter-spacing:-.03em;background:none;border:0;color:var(--ink);text-align:left;padding:4px 0 8px;min-height:55px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline}
.pick.ph{color:var(--mute);opacity:.55}
.pop{position:fixed;z-index:50;background:var(--bg);border:1px solid var(--line);border-radius:6px;box-shadow:0 21px 55px -21px rgba(0,0,0,.35);padding:21px;animation:in .25s cubic-bezier(.2,.7,.2,1)}
.cal-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.cal-h b{font-weight:400;font-size:var(--t2);letter-spacing:-.02em;text-transform:capitalize}
.cal-h button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:var(--t1);cursor:pointer;margin-left:8px}
.cal-h button:disabled{opacity:.25;cursor:default}
.cal-w,.cal-d{display:grid;grid-template-columns:repeat(7,55px);justify-items:center}
.cal-w span{font-size:var(--t0);letter-spacing:.1em;color:var(--mute);padding:8px 0}
.cal-d button{width:48px;height:48px;border-radius:50%;border:0;background:none;color:var(--ink);font:400 var(--t1) "Inter Tight",sans-serif;cursor:pointer;margin:3px 0;position:relative}
.cal-d button:hover:not(:disabled){background:var(--field)}
.cal-d button:disabled{color:var(--mute);opacity:.35;cursor:default}
.cal-d button.today::after{content:"";position:absolute;left:50%;bottom:7px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--acc)}
.cal-d button.on{background:var(--ink);color:var(--bg)}
.tcols{display:grid;grid-template-columns:89px 89px;gap:13px}
.tcol{height:275px;overflow-y:auto;scrollbar-width:none;display:grid;align-content:start;gap:2px;-webkit-mask-image:linear-gradient(transparent,#000 21%,#000 79%,transparent);mask-image:linear-gradient(transparent,#000 21%,#000 79%,transparent);padding:110px 0}
.tcol button{height:48px;border:0;border-radius:24px;background:none;color:var(--ink);font:400 var(--t2) "Inter Tight",sans-serif;cursor:pointer;font-variant-numeric:tabular-nums}
.tcol button:hover{background:var(--field)}.tcol button.on{background:var(--ink);color:var(--bg)}
.field.bad{border-bottom-color:var(--acc)}.field.bad label{color:var(--acc)}
.hint{font-size:var(--t0);color:var(--mute);margin-top:8px;line-height:1.5}.opt.prev{border-bottom:0}
.nav{display:flex;justify-content:space-between;align-items:center;padding-top:21px;border-top:1px solid light-dark(#fff,rgba(255,255,255,.22));margin-top:21px}
.nav button{font:500 var(--t2) "Inter Tight",sans-serif;letter-spacing:-.02em;background:none;border:0;color:var(--ink);cursor:pointer;min-height:48px;padding:0}
.nav .next{display:inline-flex;gap:14px;align-items:center}
.nav .next::after{content:"→";transition:transform .2s}
.nav .next:hover::after{transform:translateX(6px)}
.nav .back{color:var(--mute)}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
button:disabled{opacity:.35;cursor:not-allowed}
/* filas grandes */
.row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,.618fr) 44px;align-items:baseline;gap:13px;border-bottom:1px solid var(--line);min-height:var(--t4)}
.mail{font:400 var(--t1) "Inter Tight",sans-serif;border:0;background:none;color:var(--ink);padding:8px 0;min-height:44px;width:100%;transition:opacity .2s}
.mail::placeholder{color:var(--mute)}.mail:focus{outline:none}.row.bad{border-bottom-color:var(--acc)}.row.bad .mail{color:var(--acc)!important;visibility:visible;opacity:1}
.row:not(:focus-within) .mail:placeholder-shown{opacity:0;pointer-events:none}
.row:not(:focus-within) .mail:not(:placeholder-shown){color:var(--mute)}
.row.empty .tool,.row.empty .mail{visibility:hidden}
.big::placeholder{transition:opacity .2s}.row.empty:not(:focus-within) .big::placeholder{opacity:.32}
.idx{font-size:var(--t0);color:var(--mute);font-variant-numeric:tabular-nums}
.big{font:400 clamp(var(--t2),3.1vw,var(--t3)) "Inter Tight",sans-serif;letter-spacing:-.03em;width:100%;border:0;background:none;color:var(--ink);padding:8px 0;min-height:55px}
.big::placeholder{color:var(--mute);opacity:.55}
.big:focus{outline:none}
.row:focus-within{border-bottom-color:var(--ink)}.row .big:placeholder-shown{font-size:clamp(var(--t2),3.1vw,var(--t3))}
.tool{display:flex;gap:8px;align-self:center}
.tool button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);display:grid;place-items:center;padding:0;line-height:0;cursor:pointer}
.tool button:hover{border-color:var(--ink);color:var(--ink)}.tool svg{width:21px;height:21px;pointer-events:none}
.extra{grid-column:2/4;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:0 0 14px}
.small{font:400 17px "Inter Tight",sans-serif;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--field);color:var(--ink);padding:12px 10px;min-height:46px;border-radius:4px 4px 0 0}
.small::placeholder{color:var(--mute)}
.add{font:400 var(--t2) "Inter Tight",sans-serif;letter-spacing:-.02em;background:none;border:0;color:var(--mute);cursor:pointer;padding:16px 0;text-align:left;min-height:56px}
.add:hover{color:var(--ink)}
/* filas con opciones */
.opt{display:grid;grid-template-columns:minmax(0,.382fr) minmax(0,.618fr);gap:21px;align-items:center;border-bottom:1px solid var(--line);padding:13px 0;min-height:var(--t4)}
.opt .nm{font-size:var(--t2);letter-spacing:-.03em}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:10px;font:400 17px "Inter Tight",sans-serif;background:none;border:1px solid var(--line);border-radius:999px;color:var(--ink);padding:8px 16px 8px 10px;min-height:44px;cursor:pointer}
.chip::before{content:"";width:16px;height:16px;border-radius:50%;border:1px solid currentColor;flex:none}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed=true]::before{background:var(--acc);border-color:var(--acc)}
/* campos de reglas */
.field{border-bottom:1px solid var(--line);padding:21px 0 0}.list>.field:first-child{padding-top:0}
.field label{display:block;font-size:var(--t0);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-bottom:5px}
.field .big{font-size:clamp(var(--t2),2.6vw,var(--t3));min-height:52px;padding:2px 0 6px}
/* sortear */
.huge{font-size:clamp(var(--t4),min(13vw,21vh),var(--t6));line-height:.85;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
.huge+div{font-size:var(--t2);letter-spacing:-.02em;margin-top:13px;line-height:1.3}
.facts{list-style:none;padding:0;margin:34px 0 0;color:var(--mute);display:grid;gap:10px;max-width:52ch}
.facts li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.facts li::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--acc);margin-top:8px}
.go{display:flex;align-items:center;gap:21px;font:400 clamp(var(--t3),4vw,var(--t4)) "Inter Tight",sans-serif;letter-spacing:-.04em;background:none;border:0;color:var(--ink);cursor:pointer;padding:18px 0;margin-top:26px;min-height:64px;text-align:left}
.go::before{content:"";width:.8em;height:.8em;border-radius:50%;border:1.5px solid currentColor;flex:none;transition:background .2s}
.go:hover::before{background:var(--acc);border-color:var(--acc)}
/* envío */
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 20px;align-items:center;border-bottom:1px solid var(--line);padding:14px 0}
.srow .nm{font-size:clamp(var(--t2),2.6vw,var(--t3));letter-spacing:-.03em;display:flex;align-items:center;gap:12px}
.srow .nm small{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--acc)}
.links{display:flex;gap:6px 18px;flex-wrap:wrap;justify-content:flex-end}
.links a,.links button{font:500 15px "Inter Tight",sans-serif;color:var(--ink);background:none;border:0;border-bottom:1px solid var(--line);padding:10px 0 4px;cursor:pointer;text-decoration:none;min-height:44px}
.links a:hover,.links button:hover{border-bottom-color:var(--ink)}
.meta{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:22px}
.meta label{display:block;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-bottom:6px}
.inline{display:flex;gap:10px;align-items:end}
.inline .links{flex:none}
/* revelación */
.reveal{display:flex;flex-direction:column;justify-content:center;flex:1}
.tap{display:flex;align-items:center;gap:21px;font:400 clamp(var(--t3),4vw,var(--t4)) "Inter Tight",sans-serif;letter-spacing:-.04em;background:none;border:0;color:var(--ink);cursor:pointer;text-align:left;padding:10px 0}
.tap span.o{width:1.25em;height:1.25em;border-radius:50%;border:1.5px solid currentColor;flex:none;display:grid;place-items:center;animation:pulse 2.2s ease-in-out infinite}
.tap span.o::after{content:"";width:30%;height:30%;border-radius:50%;background:var(--acc)}
@keyframes pulse{50%{transform:scale(1.08)}}
.who{font-weight:500;font-size:clamp(var(--t4),12vw,var(--t6));line-height:.88;letter-spacing:-.06em;overflow-wrap:anywhere}
.who span{display:inline-block;animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(.4em)}}
.after{margin-top:34px;border-top:1px solid var(--line);display:grid}
.after div{display:grid;grid-template-columns:minmax(0,.382fr) minmax(0,.618fr);gap:16px;border-bottom:1px solid var(--line);padding:12px 0}
.after dt{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);padding-top:3px}
.after dd{margin:0;font-size:19px}
.msg{font-size:15px;color:var(--acc);min-height:22px;margin-top:10px}
.ok{color:var(--ink)}.msg:empty{display:none}
.q{position:relative}.q>*{position:relative;z-index:1}
#ascii{position:absolute!important;z-index:0!important;left:0;bottom:0;margin:0;font:400 9px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:0;color:var(--ink);opacity:.2;pointer-events:none;user-select:none;white-space:pre}
[hidden]{display:none!important}
@media(max-width:780px){
:root{--g:0px}.paper{inset:64px 0 0}header{height:64px;padding:0 calc(2*var(--dot))}.brand{font-size:19px}.top{display:flex;white-space:nowrap}.top a,.top button{margin-left:16px;font-size:11px;letter-spacing:.06em}.top .theme{margin-left:8px}.dk{display:none}.brand{font-size:17px}.pop{right:16px;padding:16px}.cal-w,.cal-d{grid-template-columns:repeat(7,minmax(0,1fr))}.cal-d button{width:42px;height:42px}.tcols{grid-template-columns:1fr 1fr}.when{gap:21px}
.screen{grid-template-columns:minmax(0,1fr);height:auto;min-height:calc(100dvh - 64px);gap:34px;padding:calc(2*var(--dot)) calc(2*var(--dot)) calc(3*var(--dot))}.q,.a{grid-column:1}
.count{order:-1;font-size:var(--t4);margin:0 0 21px}.count.sm{font-size:var(--t3)}
.q p{margin-top:12px}.list{overflow:visible}.list.more{-webkit-mask-image:none;mask-image:none}
.opt{grid-template-columns:minmax(0,1fr);gap:10px}.row{grid-template-columns:34px minmax(0,1fr) 44px;row-gap:0}.row .mail{grid-column:2/3;grid-row:2;margin-bottom:8px}.row .mail,.row:not(:focus-within) .mail:placeholder-shown{opacity:1;pointer-events:auto}.row.empty .mail{display:none}h1{font-size:var(--t3)}.extra,.meta{grid-template-columns:minmax(0,1fr)}
.srow{grid-template-columns:minmax(0,1fr)}.links{justify-content:flex-start}
.after div{grid-template-columns:minmax(0,1fr);gap:2px}
.nav{position:sticky;bottom:0;background:var(--bg);padding-bottom:12px}#ascii{display:none}}
@media(prefers-reduced-motion:reduce){.screen,.who span,.tap span.o{animation:none}}
</style>

<div class="paper" aria-hidden="true"></div>
<header>
  <div class="brand">amigo<i>.</i>invisible</div>
  <nav class="top"><button id="mOrg" aria-pressed="true">Organizar</button><button id="mVer" aria-pressed="false"><span class="dk">Mi </span>resultado</button><button id="theme" class="theme" aria-label="Cambiar a modo oscuro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button></nav>
</header>
<main id="app"></main>

<script>
{
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const PAGE_URL=(/^https?:$/.test(location.protocol)&&!/claude|anthropic|usercontent/.test(location.hostname))?location.origin+location.pathname:"https://miguel-moya.github.io/amigo-invisible/";
const esc=t=>String(t??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function rnd(n){const a=new Uint32Array(1),lim=Math.floor(4294967296/n)*n;let v;do{crypto.getRandomValues(a);v=a[0]}while(v>=lim);return v%n}

/* ---------- códigos ---------- */
const enc=new TextEncoder(),dec=new TextDecoder();
function ks(seed,len){let x=seed>>>0||1;const o=new Uint8Array(len);for(let i=0;i<len;i++){x^=x<<13;x>>>=0;x^=x>>>17;x^=x<<5;x>>>=0;o[i]=x&255}return o}
function b64u(b){let s="";b.forEach(c=>s+=String.fromCharCode(c));return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
function ub64(s){s=s.replace(/-/g,"+").replace(/_/g,"/");const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))}
function seal(prefix,obj){const d=enc.encode(JSON.stringify(obj)),seed=new Uint32Array(1);crypto.getRandomValues(seed);const k=ks(seed[0],d.length),o=new Uint8Array(d.length+4);new DataView(o.buffer).setUint32(0,seed[0]);d.forEach((c,i)=>o[i+4]=c^k[i]);return prefix+b64u(o)}
function unseal(prefix,s){s=s.trim().replace(/\s+/g,"");if(!s.startsWith(prefix))throw 0;const o=ub64(s.slice(prefix.length)),seed=new DataView(o.buffer).getUint32(0),d=o.slice(4),k=ks(seed,d.length);return JSON.parse(dec.decode(d.map((c,i)=>c^k[i])))}
const B32="0123456789ABCDEFGHJKMNPQRSTVWXYZ";
function toB32(b){let bits=0,v=0,o="";b.forEach(c=>{v=(v<<8)|c;bits+=8;while(bits>=5){o+=B32[(v>>>(bits-5))&31];bits-=5}});if(bits)o+=B32[(v<<(5-bits))&31];return o.match(/.{1,5}/g).join("-")}
function fromB32(s){s=s.toUpperCase().replace(/O/g,"0").replace(/[IL]/g,"1").replace(/[^0-9A-Z]/g,"");let bits=0,v=0;const o=[];for(const ch of s){const k=B32.indexOf(ch);if(k<0)throw 0;v=((v<<5)|k)&0xffff;bits+=5;if(bits>=8){o.push((v>>>(bits-8))&255);bits-=8}}return Uint8Array.from(o)}
const idBytes=id=>fromB32(id.replace("-","")+"00");

const eur=v=>{v=(v||"").trim();return/^\d+([.,]\d+)?$/.test(v)?v+" €":v};
const fdate=d=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(d||""))return d||"";const t=new Date(d+"T12:00:00");return t.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"})};
function msgFor(p){const L=[["Presupuesto",eur(st.price)],["Cuándo",fdate(st.date)+(st.time?`, a las ${st.time}`:"")],["Dónde",st.place]].filter(x=>(x[1]||"").trim()).map(x=>`${x[0]}: ${x[1].trim()}`);
  return [`Hola, ${p.n}: ya tienes tu amigo invisible.`,``,`Ábrelo aquí (solo lo verás tú):`,baseUrl()+"#"+p.code,...(L.length?[``,...L]:[]),...((st.note||"").trim()?[``,st.note.trim()]:[]),``,`Sorteo nº ${result.id}${(st.org||"").trim()?` · organiza ${st.org.trim()}`:""}. Tiene que ser el mismo número para todos.`].join("\n")}

/* ---------- eventos ---------- */
function bind(v,arg){
  $$("[data-to]").forEach(b=>b.onclick=()=>goTo(+b.dataset.to));
  if(v===1){
    $("#rows").addEventListener("input",e=>{const t=e.target;if(!t.dataset.f)return;const i=+t.dataset.i;st.people[i][t.dataset.f]=t.value;save();$("#m1").textContent="";t.closest(".row").classList.remove("bad");
      if(t.dataset.f==="n"){t.closest(".row").classList.toggle("empty",!t.value.trim());
        if(t.value.trim()&&i===st.people.length-1){st.people.push(blank());save();$("#rows").insertAdjacentHTML("beforeend",rowHTML(st.people[i+1],i+1))}}});
    $("#rows").addEventListener("keydown",e=>{const t=e.target;if(e.key!=="Enter")return;e.preventDefault();const i=+t.dataset.i;
      if(t.dataset.f==="n"){const m=$(`[data-f="e"][data-i="${i}"]`);const nx=$(`[data-f="n"][data-i="${i+1}"]`);if(nx)nx.focus();else m.focus()}
      else{const nx=$(`[data-f="n"][data-i="${i+1}"]`);if(nx)nx.focus()}});
    $("#rows").addEventListener("click",e=>{const t=e.target.closest("[data-del]");if(!t)return;const d=+t.dataset.del;st.people.splice(d,1);st.people.forEach(p=>p.x=p.x.filter(j=>j!==d).map(j=>j>d?j-1:j));save();show(1)});
  }
  if(v===2){$$("[data-ex]").forEach(b=>b.onclick=()=>{const p=st.people[+b.dataset.ex],j=+b.dataset.to2;p.x=p.x.includes(j)?p.x.filter(x=>x!==j):[...p.x,j];b.setAttribute("aria-pressed",p.x.includes(j));save()});
    const up=$("#usePrev");if(up)up.onclick=()=>{st.usePrev=st.usePrev===false;save();up.setAttribute("aria-pressed",st.usePrev!==false);loadHist()}}
  if(v===3){$("#pickDate").onclick=e=>{if(popFor==="date"){closePop();return}const b=e.currentTarget,d=st.date?new Date(st.date+"T12:00:00"):new Date();calY=d.getFullYear();calM=d.getMonth();calendar(b)};
    $("#pickTime").onclick=e=>{if(popFor==="time"){closePop();return}clock(e.currentTarget)}}
  if(v===3){const ta=$("#note"),grow=()=>{ta.style.height="auto";ta.style.height=ta.scrollHeight+"px"};ta.addEventListener("input",grow);grow()}
  if(v===3)$$("[data-r]").forEach(el=>{el.oninput=el.onchange=()=>{st[el.dataset.r]=el.value;save();const f=el.closest(".field");if(f)f.classList.remove("bad");$("#m3").textContent=""};
    if(el.tagName!=="TEXTAREA")el.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();const all=$$("[data-r]"),k=all.indexOf(el);all[k+1]?all[k+1].focus():goTo(4)}}});
  if(v===4)$("#draw").onclick=()=>{const ps=active(),p=draw(allowed(ps));if(!p){$("#m4").textContent="No se ha encontrado un sorteo válido.";return}
    const ALPHA="23456789ABCDEFGHJKMNPQRSTVWXYZ";let id="";for(let i=0;i<6;i++)id+=ALPHA[rnd(ALPHA.length)];id=id.slice(0,3)+"-"+id.slice(3);
    result={v:2,id,url:PAGE_URL,people:ps.map((a,i)=>{const b=ps[p[i]];return{n:a.n.trim(),e:a.e.trim(),code:shortSeal(id,b.n.trim(),""),sent:false}}),hist:seal("H1-",{id,p:ps.map((a,i)=>[norm(a.n),norm(ps[p[i]].n)])})};
    const H=(store.get("ai-hist")||[]).filter(x=>x.id!==id).slice(-4);H.push({id,t:Date.now(),h:result.hist});store.set("ai-hist",H);store.set("ai-result",result);show("send")};
  if(v==="send"){
    $("#url").onchange=()=>{result.url=$("#url").value.trim();store.set("ai-result",result);show("send")}}
  if(v==="ver"){
    if(arg){const reveal=()=>{const rv=$("#rv");rv.innerHTML=`<div class="who" aria-live="polite">${[...arg.r].map((c,k)=>`<span style="animation-delay:${k*45}ms">${c===" "?"&nbsp;":esc(c)}</span>`).join("")}</div>
        <dl class="after">${arg.i?`<div><dt>Su pista</dt><dd>${esc(arg.i)}</dd></div>`:""}<div><dt>Número de sorteo</dt><dd>${esc(arg.id)}: tiene que coincidir con el de los demás</dd></div><div><dt>Precio, fecha y lugar</dt><dd>En el mensaje que te llegó</dd></div></dl>`};
      $("#tap").onclick=reveal}
    else{const open=()=>{try{show("ver",shortOpen($("#code").value))}catch(e){$("#mv").textContent="Ese código no es válido. Revisa que esté completo."}};
      $("#openCode").onclick=open;$("#code").onkeydown=e=>{if(e.key==="Enter")open()}}}
}
$("#app").addEventListener("click",async e=>{if(cur!=="send")return;const t=e.target.closest("[data-sent],[data-copy],[data-mark],#redo");if(!t)return;
            if(t.id==="redo"){store.set("ai-hist",(store.get("ai-hist")||[]).filter(x=>x.id!==result.id));result=null;store.del("ai-result");show(4);return}
      if(t.dataset.copy!=null){const p=result.people[+t.dataset.copy];try{await navigator.clipboard.writeText(msgFor(p));t.textContent="Copiado";p.sent=true;store.set("ai-result",result);setTimeout(()=>show("send"),1100)}catch(err){t.textContent="No se pudo copiar"}return}
      if(t.dataset.mark!=null){const p=result.people[+t.dataset.mark];p.sent=!p.sent;store.set("ai-result",result);show("send");return}
      if(t.dataset.sent!=null){result.people[+t.dataset.sent].sent=true;store.set("ai-result",result);setTimeout(()=>show("send"),400)}});
{const tb=$("#theme");const isDark=()=>(document.documentElement.dataset.theme||(matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light"))==="dark";
 const lab=()=>tb.setAttribute("aria-label",isDark()?"Cambiar a modo claro":"Cambiar a modo oscuro");lab();
 tb.onclick=()=>{const t=isDark()?"light":"dark";document.documentElement.dataset.theme=t;store.set("ai-theme",t);try{localStorage.setItem("ai-theme",t)}catch(e){}lab()}}
$("#mOrg").onclick=()=>{if(location.hash)history.replaceState(null,"",location.pathname+location.search);show(result?"send":1)};
$("#mVer").onclick=()=>show("ver");

/* ---------- inicio ---------- */
const hc=location.hash.slice(1);
if(hc==="ver")show("ver");
else if(/^[0-9A-Za-z]{5}(-[0-9A-Za-z]{1,5})+$/.test(hc)){let r=null;try{r=shortOpen(hc)}catch(e){}r?show("ver",r):show("ver",null,"El enlace no es válido. Pide a quien organiza que te lo reenvíe.")}
else show(result?"send":1);
}
</script>
</body>
</html>
